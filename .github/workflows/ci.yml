name: CI Hardening & Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check . --ignore E501,E402,F401,F841,E722

  test:
    name: Unit & Hardening Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1-mesa-glx

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite
        env:
          INFERENCE_BACKEND: groq
          GROQ_API_KEY: gsk_ci_dummy_test_key_1234567890
          ALLOW_CLOUD_ESCALATION: "true"
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=term-missing:skip-covered
